<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Both faces that set text above the fold are preloaded so they are
         requested alongside the stylesheet rather than discovered after it.
         Metric-matched fallbacks make the swap shift-free vertically, but the
         line breaks in the hero paragraph can still differ between fallback and
         real face, and that reflow was the site's only measured layout shift.
         Plex Mono is not preloaded: it sets no text above the fold. -->
    <link
      rel="preload"
      href="/fonts/newsreader-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plex-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Everything below is written at build time by scripts/prerender.mjs from
         src/site.ts, so titles, canonicals, cards and JSON-LD have one source.
         The fallback title exists only for `npm run dev`. -->
    <title>Andres Botia — Software Engineer</title>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
