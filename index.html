<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Newsreader sets the h1, which is the LCP element. Preloaded so it is
         requested alongside the stylesheet rather than after it. The other two
         faces are metric-matched to their fallbacks, so discovering them later
         costs a glyph swap and no layout shift. -->
    <link
      rel="preload"
      href="/fonts/newsreader-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Everything below is written at build time by scripts/prerender.mjs from
         src/site.ts, so titles, canonicals, cards and JSON-LD have one source.
         The fallback title exists only for `npm run dev`. -->
    <title>Andres Botia — Software Engineer</title>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
