<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Newsreader sets the h1, which is the LCP element. Preloaded so it is
         requested alongside the stylesheet rather than after it. The other two
         faces are metric-matched to their fallbacks, so discovering them later
         costs a glyph swap and no layout shift. -->
    <link
      rel="preload"
      href="/fonts/newsreader-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Andres Botia is a software engineer building modern interfaces, backend systems, APIs, SQL/data workflows, automation, IBM i/RPG integrations, aviation technology, and operational software."
    />
    <link rel="canonical" href="https://andresbotia.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Andres Botia | Software Engineer" />
    <meta
      property="og:description"
      content="A technical, cinematic portfolio for Andres Botia, focused on modern interfaces connected to complex real-world systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andresbotia.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andres Botia | Software Engineer" />
    <meta
      name="twitter:description"
      content="Modern React, APIs, SQL/data, automation, IBM i/RPG systems, aviation technology, and operational software."
    />
    <meta name="theme-color" content="#05070b" />
    <title>Andres Botia | Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
